<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A simple to use, offline, phonetic translator.">
  <meta name="author" content="vicsar - 7411419+vicsar@users.noreply.github.com">

  <title>.: NATO translator :.</title>

  <style>
    /* ------------------------------------------------------------------ */
    /* Visually hidden utility — readable by screen readers, invisible     */
    /* ------------------------------------------------------------------ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ------------------------------------------------------------------ */
    /* Base                                                                */
    /* ------------------------------------------------------------------ */
    body,
    html {
      margin: 0;
      padding: 0;
    }

    body {
      padding: 10px;
      background: #3f3f3f;
      color: #dcdccc;
    }

    * {
      box-sizing: border-box;
      max-width: 100%;
    }

    /* ------------------------------------------------------------------ */
    /* Focus ring — visible on dark backgrounds (WCAG 2.4.7)              */
    /* ------------------------------------------------------------------ */
    input:focus,
    button:focus,
    textarea:focus {
      outline: 2px solid #80d4b2;
      outline-offset: 2px;
    }

    /* ------------------------------------------------------------------ */
    /* Label                                                               */
    /* ------------------------------------------------------------------ */
    label {
      font-size: 1.3em;
      color: #80d4b2;
      font-weight: bold;
      margin: 0 0 0 10px;
    }

    /* ------------------------------------------------------------------ */
    /* Input                                                               */
    /* ------------------------------------------------------------------ */
    input[type="text"] {
      cursor: text;
      padding: 4px 6px;
      font-size: 18px;
      width: 80%;
      min-width: 320px;
      border-radius: 5px;
      background: #363535;
      color: #dcdccc;
      border: 1px solid #ccc;
      margin: 2px 0 0 10px;
    }

    /* ------------------------------------------------------------------ */
    /* Buttons                                                             */
    /* ------------------------------------------------------------------ */
    .button {
      background-color: #555555;
      border: 1px solid #dcdccc;
      border-radius: 5px;
      color: white;
      padding: 8px 8px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 12px;
      cursor: pointer;
      margin: 6px 0 0 10px;
    }

    .NATOButton:hover {
      background-color: #4caf50;
    }

    /* Button press animation */
    @keyframes gradient {
      0% {
        background: radial-gradient(circle at center, rgba(22, 92, 33, 0) 0%, #fff 0%, #fff 100%);
      }

      25% {
        background: radial-gradient(circle at center, rgba(42, 121, 55, 0.3) 24%, #fff 25%, #fff 100%);
      }

      50% {
        background: radial-gradient(circle at center, rgba(111, 185, 123, 0.5) 49%, #fff 50%, #fff 100%);
      }

      75% {
        background: radial-gradient(circle at center, rgba(128, 205, 141, 0.8) 74%, #fff 75%, #fff 100%);
      }

      100% {
        color: #fff;
        background: radial-gradient(circle at center, rgba(142, 224, 156, 0.8) 99%, #fff 100%, #fff 100%);
      }
    }

    button:active {
      animation: gradient 600ms;
      background: #f88;
      color: #fff;
      box-shadow: none;
    }

    /* ------------------------------------------------------------------ */
    /* Copy / speech status feedback                                        */
    /* ------------------------------------------------------------------ */
    #copy-status {
      display: inline-block;
      margin: 6px 0 0 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
      vertical-align: middle;
    }

    #copy-status.visible {
      opacity: 1;
    }

    #copy-status.success {
      color: #80d4b2;
    }

    #copy-status.error {
      color: #ff8888;
    }

    /* ------------------------------------------------------------------ */
    /* Output area — flex replaces float for WCAG 1.4.10 Reflow at 400%   */
    /* ------------------------------------------------------------------ */
    .output-area {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-top: 6px;
    }

    textarea {
      background: transparent;
      color: #dcdccc;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin: 0 0 0 10px;
      /* readonly: cursor:default is appropriate; not-allowed implies disabled */
      cursor: default;
      flex-shrink: 0;
      height: 320px;
      width: 32%;
      min-width: 320px;
    }

    /* ------------------------------------------------------------------ */
    /* Phonetic list                                                        */
    /* ------------------------------------------------------------------ */
    .list {
      list-style: none;
      flex-shrink: 0;
      padding: 0;
      margin: 0 0 0 20px;
    }

    .list li {
      padding: 2px 0;
      margin: 0;
      min-height: 24px;
      line-height: 20px;
    }

    /* .char-key: presentational glyph, hidden from AT via aria-hidden     */
    /* Screen readers use the adjacent .sr-only span instead               */
    .char-key {
      display: inline-block;
      width: 30px;
      text-align: center;
      background: #0c0c0c;
      padding: 0 5px;
      border-radius: 3px;
      margin: 0 6px 0 0;
      font-weight: bold;
    }

    .list li.unknown {
      color: #ff8888;
      font-style: italic;
    }
  </style>

  <script>
    /* ------------------------------------------------------------------ */
    /* Character map — frozen to prevent accidental runtime mutation       */
    /* ------------------------------------------------------------------ */
    const codes = Object.freeze({
      /* NATO / ICAO phonetic alphabet */
      A: "Alfa",
      B: "Bravo",
      C: "Charlie",
      D: "Delta",
      E: "Echo",
      F: "Foxtrot",
      G: "Golf",
      H: "Hotel",
      I: "India",
      J: "Juliett",
      K: "Kilo",
      L: "Lima",
      M: "Mike",
      N: "November",
      Ñ: "Ñaño",         /* non-standard, retained by author */
      O: "Oscar",
      P: "Papa",
      Q: "Quebec",
      R: "Romeo",
      S: "Sierra",
      T: "Tango",
      U: "Uniform",
      V: "Victor",
      W: "Whiskey",
      X: "X-ray",
      Y: "Yankee",
      Z: "Zulu",

      /* Digits */
      0: "Zero",
      1: "One",
      2: "Two",
      3: "Three",
      4: "Four",
      5: "Five",
      6: "Six",
      7: "Seven",
      8: "Eight",
      9: "Niner",

      /* Whitespace
         NOTE: Tab (\t) is not typeable in the input field — pressing Tab
         moves browser focus. This mapping is intentionally reachable via
         paste only (e.g. pasting tab-delimited text). */
      " ": "Space",
      "\t": "Tab",

      /* Punctuation & symbols */
      "-": "Hyphen-minus",
      "−": "Minus sign",
      "_": "Underscore",
      "@": "At",
      ".": "Dot",
      "+": "Plus",
      "/": "Slash",
      ":": "Colon",
      ",": "Comma",
      "*": "Asterisk",
      "\\": "Backslash",
      "=": "Equal sign",
      "%": "Percent sign",
      "?": "Question mark",
      '"': "Quotation mark",
      "'": "Single quote",
      "`": "Backtick",
      "!": "Exclamation mark",
      "{": "Open curly bracket",
      "}": "Close curly bracket",
      "(": "Open parenthesis",
      ")": "Close parenthesis",
      "[": "Open square bracket",
      "]": "Close square bracket",
      "<": "Less-than / Open angle bracket",
      ">": "Greater-than / Close angle bracket",
      "#": "Number sign/Hashtag/Octothorpe",
      "&": "Ampersand",
      "|": "Pipe/Vertical bar",
      "^": "Caret",
      "~": "Tilde",
      ";": "Semicolon",
    });

    /* ------------------------------------------------------------------ */
    /* XSS safety — escapes characters that are HTML-significant           */
    /* Used before any user-supplied string is injected into innerHTML.    */
    /* ------------------------------------------------------------------ */
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* ------------------------------------------------------------------ */
    /* Copy with visible feedback                                           */
    /* Keyboard shortcut: Ctrl+Shift+C (see keydown listener in init)      */
    /* ------------------------------------------------------------------ */
    let statusTimer = null;

    function showStatus(message, isSuccess) {
      const el = document.getElementById("copy-status");
      if (statusTimer) clearTimeout(statusTimer);
      el.textContent = message;
      el.className = "visible " + (isSuccess ? "success" : "error");
      statusTimer = setTimeout(() => { el.className = ""; }, 2000);
    }

    async function CopyNatoText() {
      const text = document.getElementById("convert_word").value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showStatus("✓ Copied", true);
      } catch (_err) {
        /* Fallback for non-secure contexts (e.g. file://).
           execCommand is deprecated but is the only viable offline
           fallback as of 2026. textarea is readonly — no state changes needed. */
        const ta = document.getElementById("convert_word");
        ta.select();
        const ok = document.execCommand("copy");
        showStatus(ok ? "✓ Copied" : "✗ Copy failed", ok);
      }
    }

    /* ------------------------------------------------------------------ */
    /* Speech synthesis                                                     */
    /* ------------------------------------------------------------------ */
    let speaking = false;

    function readAloud() {
      if (!window.speechSynthesis) return;

      if (speaking) {
        window.speechSynthesis.cancel();
        setSpeakingState(false);
        return;
      }

      const text = document.getElementById("convert_word").value.trim();
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.85; /* slightly slower for phonetic clarity */
      utterance.lang = "en-US";

      utterance.onstart = () => setSpeakingState(true);
      utterance.onend = () => setSpeakingState(false);
      utterance.onerror = () => setSpeakingState(false);

      window.speechSynthesis.speak(utterance);
    }

    function setSpeakingState(active) {
      speaking = active;
      const btn = document.getElementById("btn-speak");
      if (!btn) return;
      btn.textContent = active ? "Stop reading" : "Read aloud";
      btn.setAttribute("aria-pressed", String(active));
    }

    /* ------------------------------------------------------------------ */
    /* Reset without page reload                                           */
    /* ------------------------------------------------------------------ */
    function resetAll() {
      if (speaking) {
        window.speechSynthesis && window.speechSynthesis.cancel();
        setSpeakingState(false);
      }
      const input = document.getElementById("phrase");
      input.value = "";
      /* oninput does not fire on programmatic .value changes —
         convert() must be called explicitly here. */
      convert(input);
      input.focus();
    }

    /* ------------------------------------------------------------------ */
    /* Conversion                                                          */
    /* ------------------------------------------------------------------ */
    function convert(mo) {
      if (!mo) return;
      const mv = mo.value;
      const cWord = [];
      const cList = [];

      for (let i = 0; i < mv.length; i++) {
        const raw = mv.charAt(i);
        const mc = raw.toUpperCase();

        if (codes[mc] !== undefined) {
          /* Whitespace has no printable glyph — use a visible symbol.
             aria-hidden on .char-key hides the decorative glyph from AT.
             .sr-only provides the source character to screen readers so
             they announce e.g. "A: Alpha" rather than just "Alpha".       */
          const glyph = mc === " " ? "·" : mc === "\t" ? "→" : escapeHtml(mc);
          /* srLabel: use the human-readable name for whitespace characters.
             Emitting the raw space/tab character produces " :" which screen
             readers announce as nothing. All other characters are safe to
             use directly as their own label.                               */
          const srLabel = mc === " " ? "Space" : mc === "\t" ? "Tab" : escapeHtml(mc);
          cList.push(
            `<li>` +
            `<span class="char-key" aria-hidden="true">${glyph}</span>` +
            `<span class="sr-only">${srLabel}:</span>` +
            `${escapeHtml(codes[mc])}` +
            `</li>`
          );
          cWord.push(codes[mc] + "\n");
        } else {
          /* Unknown character: shown explicitly in red rather than silently
             discarded. escapeHtml() prevents injection via crafted input.  */
          const safeRaw = escapeHtml(raw);
          cList.push(
            `<li class="unknown">` +
            `<span class="char-key" aria-hidden="true">?</span>` +
            `<span class="sr-only">Unknown character:</span>` +
            `${safeRaw} (unknown)` +
            `</li>`
          );
          /* Use plain speakable text — bracket notation around an
             unpronounceable character causes speech synthesis to skip it. */
          cWord.push(`unknown character\n`);
        }
      }

      document.getElementById("convert_list").innerHTML = cList.join("");
      document.getElementById("convert_word").value = cWord.join("");
    }

    /* ------------------------------------------------------------------ */
    /* Init                                                                */
    /* ------------------------------------------------------------------ */
    window.onload = function () {
      /* Hide Read aloud button if Web Speech API is unavailable */
      if (!window.speechSynthesis) {
        const btn = document.getElementById("btn-speak");
        if (btn) btn.style.display = "none";
      }

      /* Keyboard shortcut: Ctrl+Shift+C — copy without leaving the input.
         Chosen to avoid conflicts with standard browser shortcuts.
         Works from anywhere on the page.                                  */
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && e.shiftKey && e.key === "C") {
          e.preventDefault();
          CopyNatoText();
        }
      });

      document.getElementById("phrase").focus();
    };
  </script>
</head>

<body>
  <label for="phrase">Enter a phrase or word to convert below.</label>
  <br />
  <input id="phrase" name="phrase" type="text" placeholder="Type here." maxlength="500" autocomplete="off"
    autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Text to convert to NATO phonetic alphabet"
    aria-describedby="shortcut-hint" oninput="convert(this);" />
  <!-- sr-only hint: informs AT users of the available keyboard shortcut   -->
  <span id="shortcut-hint" class="sr-only">
    Press Ctrl+Shift+C to copy the converted text.
  </span>
  <br />

  <button class="button NATOButton" onclick="CopyNatoText()"
    aria-label="Copy converted NATO text to clipboard (Ctrl+Shift+C)">Copy converted text</button>

  <button class="button NATOButton" onclick="resetAll()" aria-label="Clear input and reset output">Reset</button>

  <button id="btn-speak" class="button NATOButton" onclick="readAloud()" aria-label="Read NATO phonetic output aloud"
    aria-pressed="false">Read aloud</button>

  <!-- role="status" + aria-live="polite": announces feedback without      -->
  <!-- interrupting the user's current screen reader focus                 -->
  <span id="copy-status" role="status" aria-live="polite"></span>

  <br />

  <!-- output-area: flex container for WCAG 1.4.10 Reflow compliance      -->
  <div class="output-area">

    <!-- readonly (not disabled): keeps element in the accessibility tree  -->
    <!-- and keyboard-focusable while preventing editing.                  -->
    <!-- aria-live omitted: the <ul> below is the single live region.      -->
    <textarea id="convert_word" readonly aria-label="NATO phonetic output, plain text"></textarea>

    <!-- Single aria-live region.                                          -->
    <!-- aria-atomic="false": only new/changed items are read aloud,      -->
    <!-- not the entire list on every keystroke.                           -->
    <ul class="list" id="convert_list" role="list" aria-label="NATO phonetic character breakdown" aria-live="polite"
      aria-atomic="false"></ul>

  </div>
</body>

</html>
