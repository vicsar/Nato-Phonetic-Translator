<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A simple to use, offline, phonetic translator.">
  <meta name="author" content="vicsar - 7411419+vicsar@users.noreply.github.com">

  <title>.: NATO translator :.</title>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
    }

    body {
      padding: 10px;
      background: #3f3f3f;
      color: #dcdccc;
    }

    * {
      box-sizing: border-box;
      max-width: 100%;
    }

    label {
      font-size: 1.3em;
      color: #80d4b2;
      font-weight: bold;
      margin: 0 0 0 10px;
    }

    input[type="text"] {
      cursor: text;
      padding: 4px 6px;
      font-size: 18px;
      width: 80%;
      min-width: 320px;
      border-radius: 5px;
      background: #363535;
      color: #dcdccc;
      border: 1px solid #ccc;
      margin: 2px 0 0 10px;
    }

    .button {
      background-color: #555555;
      border: 1px solid #dcdccc;
      border-radius: 5px;
      color: white;
      padding: 8px 8px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 12px;
      cursor: pointer;
      margin: 6px 0 0 10px;
    }

    .NATOButton:hover {
      background-color: #4caf50;
    }

    /* Copy status feedback */
    #copy-status {
      display: inline-block;
      margin: 6px 0 0 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
      vertical-align: middle;
    }

    #copy-status.visible {
      opacity: 1;
    }

    #copy-status.success {
      color: #80d4b2;
    }

    #copy-status.error {
      color: #f88;
    }

    /* Button animation */
    @keyframes gradient {
      0% {
        background: radial-gradient(circle at center,
            rgba(22, 92, 33, 0) 0%, #fff 0%, #fff 100%);
      }

      25% {
        background: radial-gradient(circle at center,
            rgba(42, 121, 55, 0.3) 24%, #fff 25%, #fff 100%);
      }

      50% {
        background: radial-gradient(circle at center,
            rgba(111, 185, 123, 0.5) 49%, #fff 50%, #fff 100%);
      }

      75% {
        background: radial-gradient(circle at center,
            rgba(128, 205, 141, 0.8) 74%, #fff 75%, #fff 100%);
      }

      100% {
        color: #fff;
        background: radial-gradient(circle at center,
            rgba(142, 224, 156, 0.8) 99%, #fff 100%, #fff 100%);
      }
    }

    button:active {
      animation: gradient 600ms;
      background: #f88;
      color: #fff;
      box-shadow: none;
    }

    textarea {
      background: rgba(0, 0, 0, 0);
      color: #dcdccc;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin: 6px 0 0 10px;
      outline: 0;
      cursor: not-allowed;
      float: left;
      height: 320px;
      width: 32%;
      min-width: 320px;
    }

    .list {
      list-style: none;
      vertical-align: top;
      float: left;
      padding: 0;
      margin: 20px;
    }

    .list li {
      padding: 2px 0;
      margin: 0;
      min-height: 24px;
      line-height: 20px;
    }

    .list b {
      display: inline-block;
      width: 30px;
      text-align: center;
      background: #0c0c0c;
      padding: 0 5px;
      border-radius: 3px;
      margin: 0 6px 0 0;
    }

    /* Unknown character indicator */
    .list li.unknown {
      color: #f88;
      font-style: italic;
    }
  </style>

  <script>
    /* Frozen: prevents accidental mutation at runtime */
    const codes = Object.freeze({
      /* NATO / ICAO phonetic alphabet */
      A: "Alpha",
      B: "Bravo",
      C: "Charlie",
      D: "Delta",
      E: "Echo",
      F: "Foxtrot",
      G: "Golf",
      H: "Hotel",
      I: "India",
      J: "Juliet",
      K: "Kilo",
      L: "Lima",
      M: "Mike",
      N: "November",
      Ñ: "Ñaño",         /* non-standard, retained by author */
      O: "Oscar",
      P: "Papa",
      Q: "Quebec",
      R: "Romeo",
      S: "Sierra",
      T: "Tango",
      U: "Uniform",
      V: "Victor",
      W: "Whiskey",
      X: "X-Ray",
      Y: "Yankee",
      Z: "Zulu",

      /* Digits */
      0: "Zero",
      1: "One",
      2: "Two",
      3: "Three",
      4: "Four",
      5: "Five",
      6: "Six",
      7: "Seven",
      8: "Eight",
      9: "Niner",

      /* Whitespace */
      " ": "Space",
      "\t": "Tab",

      /* Punctuation & symbols */
      "-": "Hyphen-minus",
      "−": "Minus sign",
      "_": "Underscore",
      "@": "At",
      ".": "Dot",
      "+": "Plus",
      "/": "Slash",
      ":": "Colon",
      ",": "Comma",
      "*": "Asterisk",
      "\\": "Backslash",
      "=": "Equal sign",
      "%": "Percent sign",
      "?": "Question mark",
      '"': "Quotation mark",
      "'": "Single quote",
      "`": "Backtick",
      "!": "Exclamation mark",
      "{": "Open curly bracket",
      "}": "Close curly bracket",
      "(": "Open parenthesis",
      ")": "Close parenthesis",
      "[": "Open square bracket",
      "]": "Close square bracket",
      "<": "Less-than / Open angle bracket",
      ">": "Greater-than / Close angle bracket",
      "#": "Number sign/Hashtag/Octothorpe",
      "&": "Ampersand",
      "|": "Pipe/Vertical bar",
      "^": "Caret",
      "~": "Tilde",
      ";": "Semicolon",
    });

    /* -- Copy with visible feedback ------------------------------------ */
    let statusTimer = null;

    function showCopyStatus(success) {
      const el = document.getElementById("copy-status");
      if (statusTimer) clearTimeout(statusTimer);
      el.textContent = success ? "✓ Copied" : "✗ Copy failed";
      el.className = "visible " + (success ? "success" : "error");
      statusTimer = setTimeout(() => { el.className = ""; }, 2000);
    }

    async function CopyNatoText() {
      const text = document.getElementById("convert_word").value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showCopyStatus(true);
      } catch (_err) {
        /* Fallback for non-secure contexts (e.g. file://) */
        /* document.execCommand is deprecated but remains the only viable
           offline fallback as of 2026. */
        const ta = document.getElementById("convert_word");
        ta.removeAttribute("disabled");
        ta.select();
        const ok = document.execCommand("copy");
        ta.setAttribute("disabled", true);
        showCopyStatus(ok);
      }
    }

    /* -- Reset without page reload ------------------------------------- */
    function resetAll() {
      const input = document.getElementById("phrase");
      input.value = "";
      /* oninput does not fire on programmatic .value changes,
         so convert() must be called explicitly here. */
      convert(input);
      input.focus();
    }

    /* -- Conversion ---------------------------------------------------- */
    function convert(mo) {
      if (!mo) return;
      const mv = mo.value;
      const cWord = [];
      const cList = [];

      for (let i = 0; i < mv.length; i++) {
        const raw = mv.charAt(i);
        const mc = raw.toUpperCase();

        if (codes[mc] !== undefined) {
          /* Use a visible glyph for whitespace characters in the key column */
          const display = mc === " " ? "·" : mc === "\t" ? "→" : mc;
          cList.push(`<li><b>${display}</b>${codes[mc]}</li>`);
          cWord.push(codes[mc] + "\n");
        } else {
          /* Unknown character: show explicitly rather than silently discard */
          cList.push(`<li class="unknown"><b>?</b>${raw} (unknown)</li>`);
          cWord.push(`[${raw}]\n`);
        }
      }

      document.getElementById("convert_list").innerHTML = cList.join("");
      document.getElementById("convert_word").value = cWord.join("");
    }

    /* -- Init ---------------------------------------------------------- */
    window.onload = function () {
      document.getElementById("phrase").focus();
    };
  </script>
</head>

<body>
  <label for="phrase">Enter a phrase or word to convert below.</label>
  <br />
  <input id="phrase" name="phrase" type="text" placeholder="Type here." maxlength="500" autocomplete="off"
    autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Text to convert to NATO phonetic alphabet"
    oninput="convert(this);" />
  <br />
  <button class="button NATOButton" onclick="CopyNatoText()" aria-label="Copy converted NATO text to clipboard">
    Copy converted text
  </button>
  <button class="button NATOButton" onclick="resetAll()" aria-label="Clear input and reset output">
    Reset
  </button>
  <span id="copy-status" role="status" aria-live="polite"></span>
  <br />
  <textarea id="convert_word" disabled aria-label="NATO phonetic output" aria-live="polite"></textarea>
  <ul class="list" id="convert_list" role="list" aria-label="NATO phonetic character breakdown"></ul>
</body>

</html>
